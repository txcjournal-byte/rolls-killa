name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        # no -G: CMake picks the newest Visual Studio on the runner (2022 or 2026)
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: RollsKilla-Windows-VST3
          path: build/RollsKilla_artefacts/Release/VST3/
      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: RollsKilla-Windows-Standalone
          path: build/RollsKilla_artefacts/Release/Standalone/
      - name: Upload Mini VST3
        uses: actions/upload-artifact@v4
        with:
          name: RollsKillaMini-Windows-VST3
          path: build/RollsKillaMini_artefacts/Release/VST3/
      - name: Upload Mini Standalone
        uses: actions/upload-artifact@v4
        with:
          name: RollsKillaMini-Windows-Standalone
          path: build/RollsKillaMini_artefacts/Release/Standalone/

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libfontconfig1-dev libxcomposite-dev libxext-dev libfreetype-dev libjack-jackd2-dev xvfb
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: pluginval
        run: |
          curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
          unzip -q pv.zip
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "build/RollsKilla_artefacts/Release/VST3/Rolls Killa.vst3"
          xvfb-run -a ./pluginval --strictness-level 10 --validate-in-process "build/RollsKillaMini_artefacts/Release/VST3/Rolls Killa Mini.vst3"
